name: staff_app
description: "DuoBytes HMS: hospital app for doctors and patients with offline prescriptions, history, OPD queue and appointments."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  connectivity_plus: ^7.3.2
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  printing: ^5.14.3
  sqflite_common: ^2.5.8
  sqflite_sqlcipher: ^3.4.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

dependency_overrides:
  # pdf -> image 4.11 needs a newer archive than another package resolves to.
  archive: ^4.0.10

# App icon: `dart run flutter_launcher_icons` regenerates Android/iOS icons from assets/brand.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"
  min_sdk_android: 24
